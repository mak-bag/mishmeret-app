function applicantRow(a, s){
  const name = a.full_name || 'עובד';
  const live = !s.cancelled_at && new Date(s.ends_at) > new Date();
  // הטלפון מגיע מהשרת גם ב-offered: הרעיון הוא שהשניים ידברו לפני
  // שמישהו מאשר, ולכן כפתורי הקשר מופיעים כבר שם.
  const contact = a.phone
    ? `<a class="btn ghost" href="${waLink(a.phone, `שלום ${name}, מ${S.biz.name} לגבי המשמרת`)}" target="_blank" rel="noopener"><span class="icon icon-chat"></span> וואטסאפ</a>
       <a class="btn ghost" href="tel:${esc(a.phone)}"><span class="icon icon-phone"></span> ${esc(a.phone)}</a>` : '';
  // מועמד שהגיש בעצמו נסגר על ידי המעסיק, גם אחרי שיחה מקדימה.
  // הצעה שהמעסיק יזם לעובד שלא הגיש — העובד הוא שסוגר אותה.
  const employerCloses = a.initiated_by === 'worker';
  let foot = '';
  if(a.status === 'applied' && live){
    foot = `<button class="btn" data-approve="${a.worker_id}">אישור השיבוץ</button>
            <button class="btn ghost" data-talk="${a.worker_id}">${esc(ui('ui.talk_first'))}</button>
            <button class="btn ghost" data-release="${a.worker_id}" data-as="declined">לא הפעם</button>`;
  } else if(a.status === 'offered' && live && employerCloses){
    foot = `${contact}
            <button class="btn" data-approve="${a.worker_id}">אישור השיבוץ</button>
            <button class="btn ghost" data-release="${a.worker_id}" data-as="declined">לא הפעם</button>`;
  } else if(a.status === 'confirmed'){
    foot = `${contact}
            ${a.is_regular ? `<span class="who-sub">${esc(ui('ui.regular'))} ✓</span>`
                           : `<button class="btn ghost" data-team="${a.worker_id}"><span class="icon icon-plus"></span> לצוות הקבוע</button>`}
            ${live ? `<button class="btn danger" data-release="${a.worker_id}" data-as="cancelled">ביטול השיבוץ</button>` : ''}`;
  } else if(a.status === 'offered' && live){
    foot = `${contact}
            <span class="who-sub">ההצעה נשלחה · ממתינים לאישור העובד</span>
            <button class="btn ghost" data-release="${a.worker_id}" data-as="cancelled">ביטול ההצעה</button>`;
  }
  const badge = { applied:'ממתין לאישורכם', confirmed:'✓ שובץ', offered:'הוצע',
                  declined:'נדחה', cancelled:'בוטל', withdrawn:'ביטל מועמדות' }[a.status] || '';
  const dim = ['declined','cancelled','withdrawn'].includes(a.status);
  return `<article class="card ${dim?'dim':''}">
    <div class="who-row">
      <div>
        <div class="who-name">${esc(name)}</div>
        <div class="who-sub">${esc(cityName(a.home_city_id))}${a.initiated_by==='business'?' · הוזמן על ידיכם':''}</div>
      </div>
      <span class="tag ${a.status==='confirmed'?'done':a.status==='applied'?'need':''}">${esc(badge)}</span>
    </div>
    <div class="meta">${historyTags(a)}</div>
    ${a.is_adult || (a.badges||[]).length ? `<div class="meta">
      ${a.is_adult ? `<span class="tag">${esc(ui('ui.adult_self'))}</span>` : ''}
      ${(a.badges||[]).map(b => `<span class="tag">${esc(termLabel('badge', b))}</span>`).join('')}
    </div><div class="note" style="margin-top:6px">${esc(ui('ui.badges_self'))}</div>` : ''}
    ${!a.phone && !dim ? `<div class="hint">${esc(ui(
        a.status === 'applied' ? 'ui.talk_first_hint' : 'ui.phone_after_approve'))}</div>` : ''}
    ${foot ? `<div class="card-foot">${foot}</div>` : ''}
  </article>`;
}

function shiftScreen(){
  const s = S.bizShifts.find(x => x.id === S.shiftId);
  if(!s) return `<button class="back" id="back">חזרה לעסק</button><div class="empty">המשמרת לא נמצאה.</div>`;
  const start = new Date(s.starts_at), end = new Date(s.ends_at);
  const apps  = appsOf(s.id);
  const free  = s.slots - s.filled;
  const live  = !s.cancelled_at && end > new Date();
  const offerable = live ? S.team.filter(t => !apps.some(a =>
      a.worker_id === t.worker_id && ['applied','offered','confirmed'].includes(a.status))) : [];
  const nActive = activeOf(s.id).length;
  const mine    = mayManage(s);
  // edit_shift דוחה משמרת שכבר התחילה, גם אם טרם הסתיימה
  const canEdit = mine && s.filled === 0 && new Date(s.starts_at) > new Date();

  const cancelBlock = !live ? '' : !mine
    ? `<div class="hint">${esc(resultText('not_yours'))}</div>`
    : (S.confirmCancel === s.id
    ? `<div class="panel warn">
         <div>${esc(nActive ? plural('ui.cancel_confirm', nActive) : ui('ui.cancel_confirm_none'))}</div>
         <label for="cancelReason">${esc(ui('ui.cancel_reason'))}</label>
         <input id="cancelReason" maxlength="200">
         <div class="note">${esc(ui('ui.cancel_reason_hint'))}</div>
         <div class="card-foot">
           <button class="btn danger" data-docancel="${s.id}">${esc(ui('ui.cancel_yes'))}</button>
           <button class="btn ghost" data-nocancel="1">${esc(ui('ui.cancel_no'))}</button>
         </div>
       </div>`
    : `<div class="card-foot">
         ${canEdit ? `<button class="btn ghost" data-edit="${s.id}">${esc(ui('ui.edit_shift'))}</button>` : ''}
         <button class="btn soft" data-cancel="${s.id}">${esc(ui('ui.cancel_shift'))}</button>
       </div>
       ${canEdit ? '' : `<div class="hint">${esc(
           s.filled > 0 ? ui('ui.edit_locked') : resultText('started'))}</div>`}`);

  return `<button class="back" id="back">חזרה לעסק</button>
  <h1>${esc(termLabel('role', s.role_code))}</h1>
  <div class="sub">${whenLabel(start)} · ${hhmm(start)}–${hhmm(end)} · ${hoursBetween(start,end)} שעות · ₪${esc(s.rate)} לשעה
    ${postedBy(s) ? `<br>${esc(ui('ui.posted_by'))} ${esc(postedBy(s))}` : ''}</div>
  <div class="meta">
    ${s.cancelled_at ? `<span class="tag hot">${esc(ui('ui.shift_cancelled'))}</span>`
      : free<=0 ? `<span class="tag done">✓ אויש ${s.filled}/${s.slots}</span>`
                : `<span class="tag need">${esc(plural('ui.slots_left', free))}</span>`}
    ${s.instant?'<span class="tag instant"><span class="icon icon-bolt"></span> שיבוץ מיידי</span>':''}
    ${s.urgent ?'<span class="tag hot">דחוף</span>':''}
    ${s.adults_only?`<span class="tag hot">${esc(ui('ui.adults_only'))}</span>`:''}
    ${s.transport?'<span class="tag"><span class="icon icon-van"></span> הסעות</span>':''}
    ${s.max_distance_km?`<span class="tag">עד ${s.max_distance_km} ק״מ</span>`:''}
  </div>
  ${s.descr ? `<div class="desc">${esc(s.descr)}</div>` : ''}
  ${cancelBlock}

  <h2>מועמדים</h2>
  <div class="list">${
    apps.length ? apps.map(a => applicantRow(a, s)).join('')
    : `<div class="empty"><span class="big icon icon-clock"></span>עדיין אין מועמדים.<br>אפשר להציע את המשמרת לצוות הקבוע.</div>`
  }</div>

  ${offerable.length ? `<h2>הצעה לצוות הקבוע</h2>
  <div class="list">${offerable.map(t => `<article class="card">
    <div class="who-row">
      <div><div class="who-name">${esc(S.people[t.worker_id]?.name || 'עובד')}</div>
        <div class="who-sub">${esc(cityName(S.people[t.worker_id]?.cityId))}</div></div>
      <button class="btn ghost" data-offer="${t.worker_id}">הצעת המשמרת</button>
    </div></article>`).join('')}</div>
  <div class="note">העובד מקבל הצעה ומאשר אותה בעצמו — כך שני הצדדים מסכימים.</div>` : ''}`;
}

function teamScreen(){
  return `<button class="back" id="back">חזרה לעסק</button>
  <h1>הצוות הקבוע</h1>
  <div class="sub">עובדים שכבר עבדו אצלכם. אפשר להציע להם משמרת ישירות, לפני שהיא נפתחת לכולם.</div>
  <div class="list">${
    S.team.length ? S.team.map(t => {
      const p = S.people[t.worker_id] || {};
      return `<article class="card"><div class="who-row">
        <div><div class="who-name">${esc(p.name || 'עובד')}</div>
          <div class="who-sub">${esc(cityName(p.cityId))}</div></div>
        <button class="btn ghost danger" data-unteam="${t.worker_id}">הסרה</button>
      </div></article>`;
    }).join('')
    : `<div class="empty"><span class="big icon icon-users"></span>הצוות ריק.<br>אחרי שמאשרים עובד למשמרת אפשר להוסיף אותו לכאן.</div>`
  }</div>`;
}

/* ---------- ציור ---------- */
function render(){
  // לפני הצבת ה-HTML: מופע Leaflet ששרד דריסה של #view הוא דליפה,
  // והיצירה הבאה זורקת "Map container is already initialized".
  killMaps();
  el('who').textContent = S.user ? displayName() : '';
  el('who').hidden      = !S.user;
  el('outBtn').hidden   = !S.user;
  el('tabs').hidden     = !S.user || S.screen === 'loading';
  for(const t of document.querySelectorAll('.tab')){
    t.classList.toggle('on', t.dataset.tab === S.tab);
    t.setAttribute('aria-pressed', t.dataset.tab === S.tab ? 'true' : 'false');
    t.querySelector('.lbl').textContent =
      ui(t.dataset.tab === 'board' ? 'ui.mode_worker' : 'ui.mode_biz');
  }

  const v = el('view');
  if(S.screen === 'loading')       v.innerHTML = `<div class="empty">טוען…</div>`;
  else if(S.screen === 'board')    v.innerHTML = boardScreen();
  else if(S.screen === 'profile')  v.innerHTML = profileScreen();
  else if(S.screen === 'biz')      v.innerHTML = S.biz ? bizScreen() : newBizScreen(false);
  else if(S.screen === 'editBiz')  v.innerHTML = newBizScreen(true);
  else if(S.screen === 'newShift') v.innerHTML = shiftFormScreen(null);
  else if(S.screen === 'editShift'){
    const s = S.bizShifts.find(x => x.id === S.shiftId);
    v.innerHTML = s ? shiftFormScreen(s)
      : `<button class="back" id="back">${esc(ui('ui.back'))}</button><div class="empty">המשמרת לא נמצאה.</div>`;
  }
  else if(S.screen === 'shift')    v.innerHTML = shiftScreen();
  else if(S.screen === 'team')     v.innerHTML = teamScreen();
  else                             v.innerHTML = authScreen(S.screen);
  wire();
}

function go(screen){
  S.err=''; S.mapErr=''; S.confirmCancel=null; S.confirmClose=false; S.screen=screen;
  if(screen==='board'||screen==='biz') S.tab=screen;
  render();
}

/* ---------- חיווט ---------- */
function wire(){
  const form = el('authForm');
  if(form){
    form.onsubmit = onAuthSubmit;
    el('swap').onclick = () => { S.screen = S.screen==='signup' ? 'login' : 'signup'; render(); };
  }
  const bizForm = el('bizForm');     if(bizForm)   bizForm.onsubmit   = onBizForm;
  const shiftForm = el('shiftForm');
  if(shiftForm){
    shiftForm.onsubmit = onShiftForm;
    // ברמן מוגש אלכוהול, ולכן 18+ נכפה בשרת. הטופס מראה את זה מיד.
    shiftForm.role.onchange = e => {
      const barman = e.target.value === 'bartender';
      const box = el('s_adults');
      if(barman) box.checked = true;
      box.disabled = barman;
      el('s_adults_note').textContent = barman ? ui('ui.adults_only_bartender') : '';
    };
  }
  const profForm = el('profileForm');if(profForm)  profForm.onsubmit  = onProfileForm;
  wireCityFields();
  // אחרי wireCityFields: מפת הסיכה מאזינה לאותו שדה עיר וקוראת את
  // השדה הנסתר אחרי שהוא כבר נפתר לשם→מזהה
  if(el('bizMap'))   wirePinMap(S.screen === 'editBiz');
  if(el('boardMap')) openBoardMap();
  const back = el('back');
  if(back) back.onclick = () => go(S.screen === 'editShift' ? 'shift'
                                 : S.screen === 'profile'   ? 'board' : 'biz');
  const pb = el('profileBtn');       if(pb)        pb.onclick         = () => go('profile');
  const eb = el('editBizBtn');       if(eb)        eb.onclick         = () => go('editBiz');
  const nb = el('newShiftBtn');      if(nb)        nb.onclick         = () => go('newShift');
  const tb = el('teamBtn');          if(tb)        tb.onclick         = () => go('team');

  const pick = el('bizPick');
  if(pick) pick.onchange = async e => {
    S.biz = S.bizList.find(b => b.id === e.target.value) || S.biz;
    S.screen = 'loading'; render();
    await loadBiz(); go('biz');
  };

  const rad = el('rad');
  if(rad){
    rad.oninput  = e => { S.radius = +e.target.value;
      document.querySelector('label[for="rad"]').textContent = `רדיוס נסיעה · ${S.radius} ק״מ`; };
    rad.onchange = async () => {
      await sb.from('profiles').update({ search_radius_km: S.radius }).eq('id', S.user.id);
      await loadBoard(); render();
    };
  }

  el('view').onclick = onViewClick;
}

async function onViewClick(e){
  const hit = sel => e.target.closest(sel);

  // מתג רשימה/מפה. נבדק ראשון כי הוא לא נוגע בשרת ולא טוען כלום.
  const vw = hit('[data-view]');
  if(vw){
    if(vw.dataset.view === S.view) return;
    S.view = vw.dataset.view; saveView(S.view);
    S.mapErr = '';
    return render();
  }

  const claim = hit('[data-claim]'), accept = hit('[data-accept]');
  if(claim)  return doWorker('claim_shift',  { p_shift: claim.dataset.claim  }, claim);
  if(accept) return doWorker('accept_offer', { p_shift: accept.dataset.accept }, accept);

  const open = hit('[data-shift]');
  if(open){
    S.shiftId = open.dataset.shift;
    if(!S.applicants[S.shiftId]) await loadApplicants(S.shiftId);
    return go('shift');
  }

  const approve = hit('[data-approve]');
  if(approve) return doBiz('approve_application', { p_shift:S.shiftId, p_worker:approve.dataset.approve }, approve);

  const offer = hit('[data-offer]');
  if(offer) return doBiz('offer_shift', { p_shift:S.shiftId, p_worker:offer.dataset.offer }, offer);

  // "לדבר לפני אישור" — אותה קריאה, רק שהמועמד כבר הגיש מיוזמתו
  const talk = hit('[data-talk]');
  if(talk) return doBiz('offer_shift', { p_shift:S.shiftId, p_worker:talk.dataset.talk }, talk);

  const rel = hit('[data-release]');
  if(rel) return doBiz('release_application',
    { p_shift:S.shiftId, p_worker:rel.dataset.release, p_status:rel.dataset.as }, rel);

  const edit = hit('[data-edit]');
  if(edit){ S.shiftId = edit.dataset.edit; return go('editShift'); }

  if(hit('[data-cancel]'))   { S.confirmCancel = hit('[data-cancel]').dataset.cancel; return render(); }
  if(hit('[data-nocancel]')) { S.confirmCancel = null; return render(); }

  const docancel = hit('[data-docancel]');
  if(docancel){
    docancel.disabled = true;
    const reason = (el('cancelReason')?.value || '').trim();
    const { data, error } = await sb.rpc('cancel_shift', {
      p_shift: docancel.dataset.docancel,
      p_reason: reason || null
    });
    if(error){ toast(friendly(error.message)); docancel.disabled = false; return; }
    if(data.result === 'cancelled'){
      const id = docancel.dataset.docancel;
      toast(data.released
        ? `${ui('ui.shift_cancelled')} · ${plural('ui.released', data.released)}`
        : ui('ui.shift_cancelled'),
        { label: ui('ui.undo'), run: () => undoCancel(id) });
    } else toast(resultText(data.result));
    S.confirmCancel = null;
    await loadBiz();
    if(S.shiftId) await loadApplicants(S.shiftId);
    render(); return;
  }

  if(hit('[data-close]'))   { S.confirmClose = true;  return render(); }
  if(hit('[data-noclose]')) { S.confirmClose = false; return render(); }

  const doclose = hit('[data-doclose]');
  if(doclose){
    doclose.disabled = true;
    const { data, error } = await sb.rpc('close_business', { p_business: doclose.dataset.doclose });
    if(error){ toast(friendly(error.message)); doclose.disabled = false; return; }
    if(data.result === 'closed'){
      // ui.close_* מנוסחות בעתיד ומתאימות לשאלת האישור; אחרי הפעולה
      // מדווחים בלשון עבר, והמשמרות המבוטלות ממילא נראות על המסך
      toast(data.workers_released
        ? `${resultText('closed')} · ${plural('ui.released', data.workers_released)}`
        : resultText('closed'));
    } else toast(resultText(data.result));
    S.confirmClose = false;
    await loadBiz(); render(); return;
  }

  const team = hit('[data-team]');
  if(team){
    team.disabled = true;
    const { error } = await sb.from('team_members')
      .insert({ business_id:S.biz.id, worker_id:team.dataset.team, added_by:S.user.id });
    toast(error ? friendly(error.message) : 'נוסף לצוות הקבוע');
    await loadBiz(); if(S.shiftId) await loadApplicants(S.shiftId);
    render(); return;
  }
  const unteam = hit('[data-unteam]');
  if(unteam){
    unteam.disabled = true;
    const { error } = await sb.from('team_members').delete()
      .eq('business_id', S.biz.id).eq('worker_id', unteam.dataset.unteam);
    toast(error ? friendly(error.message) : 'הוסר מהצוות');
    await loadBiz(); render(); return;
  }
}

/* טפסים: לא מציירים מחדש את המסך תוך כדי שליחה — מה שהמשתמש הקליד
   נשאר לפניו גם כשהפעולה נכשלת. */
function lockForm(form, text){
  const b = form.querySelector('button[type=submit]');
  b.dataset.label ||= b.textContent.trim();
  b.disabled = true; b.textContent = text;
  form.querySelector('.err')?.remove();
}
function unlockForm(form){
  const b = form.querySelector('button[type=submit]');
  b.disabled = false; if(b.dataset.label) b.textContent = b.dataset.label;
}
function formError(form, msg){
  // אם מחרוזות הממשק לא נטענו, עדיף בלי הודעה מאשר תיבה ריקה
  if(!msg){ form.querySelector('.err')?.remove(); return; }
  let e = form.querySelector('.err');
  if(!e){ e = document.createElement('div'); e.className = 'err';
    form.querySelector('button[type=submit]').before(e); }
  e.textContent = msg;
}

async function onAuthSubmit(ev){
  ev.preventDefault();
  const form = ev.target;
  const f = new FormData(form);
  const phone = normalizePhone(f.get('phone'));
  const pass  = f.get('pass');
  const isSignup = S.screen === 'signup';
  // אותה בדיקה שהשרת אוכף. בהרשמה בלבד — חסימה בכניסה הייתה נועלת
  // בחוץ חשבונות ישנים שנשמרו לפני שהפורמט נאכף.
  if(!phone || (isSignup && !/^9725\d{8}$/.test(phone)))
    return formError(form, resultText('bad_phone'));
  if(isSignup && !f.get('city')) return formError(form, resultText('city_not_found'));
  lockForm(form, 'רגע…');
  try{
    if(isSignup){
      const { data, error } = await sb.auth.signUp({
        email: phoneToEmail(phone),
        password: pass,
        options:{ data:{
          full_name: (f.get('name')||'').trim(),
          phone: '+' + phone,
          home_city_id: f.get('city'),
          lang: 'he', country_code: 'IL'
        }}
      });
      if(error) throw error;
      // חשבון נוצר בלי מושב פתוח — קורה כשהחשבון ממתין לאישור.
      // בלי ההודעה הזו המשתמש נשאר מול טופס ריק ולא מבין מה קרה.
      if(!data.session){
        unlockForm(form);
        formError(form, 'החשבון נוצר, אבל עדיין אי אפשר להיכנס איתו. פנו אלינו לאישור החשבון.');
        return;
      }
    } else {
      const { error } = await sb.auth.signInWithPassword({
        email: phoneToEmail(phone), password: pass
      });
      if(error) throw error;
    }
  }catch(err){
    unlockForm(form);
    formError(form, friendly(err.message));
  }
}

/* פתיחת כרטיס עסק. קריאה אחת: היא יוצרת גם את העסק וגם את הבעלות,
   כדי שלא ייווצר עסק בלי בעלים אם השנייה נכשלת. */
async function onBizForm(ev){
  ev.preventDefault();
  const form = ev.target;
  const f = new FormData(form);
  const edit = S.screen === 'editBiz';
  const phone = (f.get('phone')||'').trim();
  if(!edit && !f.get('city')) return formError(form, resultText('city_not_found'));

  /* שולחים את שתי הקואורדינטות או אף אחת. חצי נקודה מחזירה
     bad_location. השדות ריקים כל עוד המעסיק לא נגע במפה, ואז לא
     נשלחת נקודה כלל — השרת נופל למרכז העיר ומשאיר located_at ריק.
     שליחת מרכז העיר כסיכה הייתה גורמת למערכת להבטיח דיוק שאינו קיים. */
  const lat = f.get('lat'), lng = f.get('lng');
  const pin = (lat && lng) ? { p_lat:+lat, p_lng:+lng } : {};

  lockForm(form, 'רגע…');
  try{
    const { data, error } = edit
      ? await sb.rpc('update_business', {
          p_business: S.biz.id,
          p_name:     (f.get('name')||'').trim(),
          p_address:  (f.get('address')||'').trim(),
          p_phone:    phone ? '+' + normalizePhone(phone) : null,
          p_kind:     f.get('kind'),
          ...pin
        })
      : await sb.rpc('create_business', {
          p_name:    (f.get('name')||'').trim(),
          p_city_id: +f.get('city'),
          p_address: (f.get('address')||'').trim(),
          p_phone:   phone ? '+' + normalizePhone(phone) : null,
          p_kind:    f.get('kind'),
          ...pin
        });
    if(error) throw error;
    const okCode = edit ? 'saved' : 'created';
    if(data.result !== okCode){
      unlockForm(form); formError(form, resultText(data.result)); return;
    }
    await loadBiz();
    /* מעסיק שהזיז סיכה הזיז גם משמרות שכבר פורסמו, וצריך לדעת את זה.
       מחובר להודעה אחת ולא לטוסט שני: הטוסט יחיד, וקריאה שנייה
       הייתה מוחקת את הראשונה לפני שנקראה. אותה תבנית כמו בביטול משמרת. */
    toast(data.shifts_moved
      ? `${resultText(okCode)} · ${plural('ui.pin_moved_shifts', data.shifts_moved)}`
      : resultText(okCode));
    go('biz');
  }catch(err){
    unlockForm(form);
    formError(form, friendly(err.message));
  }
}

/* השלמת פרטי העובד. תאריך לידה נשמר פעם אחת בלבד, ולכן כשהוא כבר
   קיים השדה מושבת ולא נשלח בכלל. */
async function onProfileForm(ev){
  ev.preventDefault();
  const form = ev.target;
  const f = new FormData(form);
  if(!f.get('city')) return formError(form, resultText('city_not_found'));
  lockForm(form, 'רגע…');
  try{
    const { data, error } = await sb.rpc('complete_worker_profile', {
      p_given:    (f.get('given')||'').trim(),
      p_family:   (f.get('family')||'').trim(),
      p_city_id:  +f.get('city'),
      p_birth_date: f.get('birth') || null
    });
    if(error) throw error;
    if(data.result !== 'saved'){
      unlockForm(form); formError(form, resultText(data.result)); return;
    }
    await loadProfile();
    await loadBoard();
    toast(resultText('saved'));
    go('board');
  }catch(err){
    unlockForm(form);
    formError(form, friendly(err.message));
  }
}

/* פרסום או עריכה. שם העסק, העיר, המיקום ואזור הזמן נלקחים מכרטיס
   העסק בשרת — הלקוח שולח רק את מה שהמעסיק באמת מילא. */
async function onShiftForm(ev){
  ev.preventDefault();
  const form = ev.target;
  const f = new FormData(form);
  const editing = S.screen === 'editShift';
  const current = editing ? S.bizShifts.find(x => x.id === S.shiftId) : null;
  if(editing && !current) return;

  const date = f.get('date'), from = f.get('from'), to = f.get('to');
  const starts = localISO(date, from, false);
  let   ends   = localISO(date, to, false);
  if(ends <= starts) ends = localISO(date, to, true);   // משמרת שעוברת חצות

  const args = {
    p_role_code: f.get('role'),
    p_starts:    starts,
    p_ends:      ends,
    p_rate:      +f.get('rate'),
    p_slots:     +f.get('slots'),
    p_instant:   f.get('instant')   === 'on',
    p_urgent:    f.get('urgent')    === 'on',
    p_transport: f.get('transport') === 'on',
    p_descr:     (f.get('descr')||'').trim(),
    p_max_distance_km: f.get('dist') ? +f.get('dist') : null,
    // תיבה מושבתת אינה נשלחת בטופס, ולכן ברמן נקבע מפורשות
    p_adults_only: f.get('adults') === 'on' || f.get('role') === 'bartender'
  };
  if(editing){
    args.p_shift = S.shiftId;
    args.p_exp_code = current.exp_code || 'none';   // לא נערך בממשק, ולא נאפס בטעות
  } else {
    args.p_business = S.biz.id;
  }

  lockForm(form, editing ? 'רגע…' : 'מפרסם…');
  try{
    const { data, error } = await sb.rpc(editing ? 'edit_shift' : 'post_shift', args);
    if(error) throw error;
    const okCode = editing ? 'edited' : 'posted';
    if(data.result !== okCode){
      unlockForm(form); formError(form, resultText(data.result)); return;
    }
    if(!editing) S.shiftId = data.id;
    await loadBiz();
    await loadApplicants(S.shiftId);
    toast(resultText(okCode));
    go('shift');
  }catch(err){
    unlockForm(form);
    formError(form, friendly(err.message));
  }
}

// שגיאות רשת ותשתית — מה שלא מגיע כקוד תוצאה מהשרת.
function friendly(msg){
  const m = String(msg||'');
  if(/already registered/i.test(m))       return 'הטלפון הזה כבר רשום. נסו להיכנס.';
  if(/Invalid login/i.test(m))            return 'טלפון או סיסמה שגויים.';
  if(/not confirmed/i.test(m))            return 'החשבון עדיין ממתין לאישור. פנו אלינו כדי להפעיל אותו.';
  if(/at least 6/i.test(m))               return 'הסיסמה חייבת להיות באורך 6 תווים לפחות.';
  if(/row-level security|violates row|permission denied/i.test(m))
                                          return resultText('forbidden');
  if(/duplicate key/i.test(m))            return 'הרשומה כבר קיימת.';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'אין חיבור לשרת. בדקו את האינטרנט ונסו שוב.';
  return ui('ui.unknown_result');
}

/* חזרה מביטול משמרת. השרת פותח חלון של שתי דקות ומחזיר את
   השיבוצים למצבם הקודם — הלקוח לא משחזר כלום בעצמו. */
async function undoCancel(shiftId){
  const { data, error } = await sb.rpc('uncancel_shift', { p_shift: shiftId });
  if(error) return toast(friendly(error.message));
  toast(data.result === 'uncancelled' && data.restored
    ? `${resultText('uncancelled')} · ${plural('ui.restored', data.restored)}`
    : resultText(data.result));
  await loadBiz();
  if(S.shiftId) await loadApplicants(S.shiftId);
  render();
}

async function doWorker(fn, args, btn){
  btn.disabled = true;
  const { data, error } = await sb.rpc(fn, args);
  if(error){ toast(friendly(error.message)); btn.disabled = false; return; }
  toast(resultText(data));
  // סירוב שנובע מפרופיל חסר — שולחים אותו למסך שפותר את זה
  if(data === 'need_birth_date' || data === 'no_city'){ go('profile'); return; }
  await loadBoard(); render();
}

async function doBiz(fn, args, btn){
  if(!S.shiftId) return;
  btn.disabled = true;
  const { data, error } = await sb.rpc(fn, args);
  if(error){ toast(friendly(error.message)); btn.disabled = false; return; }
  S.confirmCancel = null;          // פעולה אחרת סוגרת שאלת ביטול פתוחה
  toast(resultText(data, 'biz'));
  await loadBiz();
  await loadApplicants(S.shiftId);
  render();
}

el('outBtn').onclick = async () => { await sb.auth.signOut(); };
// השם בכותרת הוא הדרך היחידה לחזור לפרטים אחרי שהושלמו
el('who').onclick = () => { if(S.user) go('profile'); };
for(const t of document.querySelectorAll('.tab'))
  t.onclick = () => go(t.dataset.tab);

/* ---------- אתחול ---------- */
async function boot(session){
  if(!session){
    S.user = null; S.profile = null; S.biz = null; S.bizList = [];
    if(S.screen !== 'signup') S.screen = 'login';
    render(); return;
  }
  S.user = session.user;
  S.screen = 'loading'; render();
  await loadProfile();
  await Promise.all([loadBoard(), loadBiz()]);
  S.screen = S.tab = 'board';
  render();
}

await loadReference();
const { data:{ session } } = await sb.auth.getSession();
await boot(session);
// רק כניסה או יציאה בונים את המסך מחדש. רענון טוקן מתרחש ברקע
// כל שעה, ואסור לו להקפיץ את הלוח חזרה למסך טעינה.
sb.auth.onAuthStateChange((event, s) => {
  if(event === 'SIGNED_IN' && S.user?.id === s?.user?.id) return;
  if(event === 'SIGNED_IN' || event === 'SIGNED_OUT') boot(s);
});
</script>
